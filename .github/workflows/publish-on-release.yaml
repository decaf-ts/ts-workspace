name: "Publish on Release"

# Triggered by the GitHub Release created in release-on-tag.yaml. Thin caller of
# decaf-ts/reusable-actions/.github/workflows/publish-on-release.yaml
# (build, test, publish @decaf-ts/ts-workspace to npm).

on:
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: read
      # OIDC trusted publishing for the deno/JSR target in the reusable
      # workflow; the npm/pnpm targets keep using the inherited NPM_TOKEN.
      id-token: write
      # Preserves the GitHub Container Registry login/publish path.
      packages: write
    uses: decaf-ts/reusable-actions/.github/workflows/publish-on-release.yaml@master
    secrets: inherit
